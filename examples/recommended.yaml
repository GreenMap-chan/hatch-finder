# Recommended starting point for training on your own dataset.
# Tune training settings for your data and hardware.
model:
  pixel_correlation:
    enabled: true
    hidden_channels: 32
    downsample: 2
  drawing_channels: [64, 128, 128, 256]
  hatch_channels: [64, 128, 128, 256]
  hatch_pool_sizes: [2, 4, 6, 6]

  match_dims: [64, 128, 256, 256]
  match_feature_dims: [16, 24, 32, 32]
  match_gate_initial_values: [0.3, 0.3, 0.3, 1.0]
  matcher_channels: [256, 64]

  drawing_residual_blocks: [1, 1, 1, 1]
  hatch_residual_blocks: [1, 1, 1, 1]

  group_norm_groups_drawings: 8
  group_norm_groups_hatchings: 8

  kernel_size: 3
  downsample_stride: 2

  transformers:
    - level: 3
      num_heads: 8
      num_blocks: 4
      downsample: 2
      mlp_ratio: 8.0
      dropout: 0.0
      initial_gate: 0.02

  hatch_transformers:
    - level: 3
      num_heads: 8
      num_blocks: 4
      downsample: 2
      mlp_ratio: 8.0
      dropout: 0.0
      initial_gate: 0.02

training:
  pixel_correlation_lr_multiplier: 1.0
  learning_rate: 0.0001
  weight_decay: 0.01
  loss: bce_dice
  epochs: 60

  batch_size: 1
  gradient_accumulation_steps: 16
  patience: 20
  num_workers: 4

  metric: val_loss
  warmup_epochs: 1

  max_grad_norm: 50.0
  seed: 42
  bf16: true
  eta_min: 0.000001
  load_model_path: null
  checkpoint_path: null

data:
  dataset: null  # Set in your local YAML or pass dataset_path to Train.
  drawing_pad_multiple: 64
  load_dataset_examples: 16

output:
  directory: null  # Set in your local YAML or pass output_path to Train.
  unique_run_directory: true
  log_file_name: "log.txt"

runtime:
  device: auto

augmentation:
  enabled: true
  seed: 42
  max_retries: 5

  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5

  drawing_rotate_90_probability: 0.75
  hatch_rotate_90_probability: 0.75

  affine_probability: 0.5
  affine_angle_degrees: 2.0
  affine_translate_percent: 0.02
  affine_scale_min: 0.95
  affine_scale_max: 1.05

  brightness_probability: 0.0
  brightness_min: 0.9
  brightness_max: 1.1

  contrast_probability: 0.0
  contrast_min: 0.9
  contrast_max: 1.1

  gamma_probability: 0.0
  gamma_min: 0.9
  gamma_max: 1.1

  blur_probability: 0.15
  blur_kernel_size: 5
  blur_sigma_min: 0.1
  blur_sigma_max: 0.9

  noise_probability: 0.2
  noise_std_min: 0.002
  noise_std_max: 0.03
