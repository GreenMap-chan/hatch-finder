model:
  pixel_correlation:
    enabled: false
    hidden_channels: 16
    downsample: 4
  drawing_channels: [32, 64, 128]
  hatch_channels: [32, 64, 128]
  hatch_pool_sizes: [2, 4, 6]

  match_dims: [64, 128, 256]
  match_feature_dims: [8, 16, 32]
  match_gate_initial_values: [0.01, 0.01, 1.0]
  matcher_channels: [256, 64]

  drawing_residual_blocks: [1, 1, 1]
  hatch_residual_blocks: [1, 1, 1]

  group_norm_groups_drawings: 8
  group_norm_groups_hatchings: 8

  kernel_size: 3
  downsample_stride: 2

  cross_attention:
   - level: 2
     num_heads: 8
     downsample: 1
     dropout: 0.0
     initial_gate: 0.01

  transformers:
    - level: 2
      num_heads: 8
      num_blocks: 1
      downsample: 4
      mlp_ratio: 4.0
      dropout: 0.0
      initial_gate: 0.01

  hatch_transformers:
    - level: 2
      num_heads: 8
      num_blocks: 1
      downsample: 2
      mlp_ratio: 4.0
      dropout: 0.0
      initial_gate: 0.5

training:
  pixel_correlation_lr_multiplier: 1.0
  learning_rate: 0.00003
  weight_decay: 0.01
  # Optional loss for experiments: bce_tversky.
  # tversky_fp_weight: 0.3
  # tversky_fn_weight: 0.7
  epochs: 150

  batch_size: 1
  gradient_accumulation_steps: 16
  patience: 8
  num_workers: 4

  metric: val_loss
  warmup_epochs: 0

  max_grad_norm: 1.0
  seed: 42
  bf16: true
  eta_min: 0.000001
  load_model_path: null
  checkpoint_path: null
  load_new_model_config: false

data:
  dataset: "./sample_dataset"
  imgsz: null  # Base size before augmentation: longest side or [height, width].
  rect: true   # Use the fitted rectangle. False centers the drawing on the requested canvas.
  load_dataset_examples: 16
  search_mask_generation:
    enabled: false
    negative_fraction: 0.20
    outside_window_share_of_negatives: 0.50
    min_margin_fraction: 0.0
    area_fraction_min: 0.15
    area_fraction_max: 0.65
    aspect_ratio_min: 0.5
    aspect_ratio_max: 2.0
    min_positive_pixels: 32
    full_tile_probability: 0.0

output:
  directory: "../runs/full_sample"
  unique_run_directory: true
  log_file_name: "log.txt"

runtime:
  device: auto

augmentation:
  # Shared transforms use one decision and sampled parameters for both inputs.
  enabled: true
  seed: 42
  max_retries: 5

  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5

  rotate_90_probability: 0.75

  affine_probability: 0.5
  affine_angle_degrees: 2.0
  affine_translate_percent: 0.02
  affine_scale_min: 0.95
  affine_scale_max: 1.05

  # Resize the image canvas; Masks always use nearest.
  resize_probability: 0.0
  resize_scale_min: 0.5
  resize_scale_max: 1.5
  resize_min_side: 1
  resize_interpolation: nearest  # nearest, bilinear, bicubic, lanczos, random

  brightness_probability: 0.3
  brightness_min: 0.9
  brightness_max: 1.1

  contrast_probability: 0.3
  contrast_min: 0.85
  contrast_max: 1.15

  gamma_probability: 0.2
  gamma_min: 0.9
  gamma_max: 1.1

  blur_probability: 0.15
  blur_kernel_size: 3
  blur_sigma_min: 0.1
  blur_sigma_max: 0.8

  noise_probability: 0.2
  noise_std_min: 0.002
  noise_std_max: 0.015

  color_overlay_probability: 0.0  # Set to enable.
  color_overlay_alpha_min: 0.02
  color_overlay_alpha_max: 0.15

  drawing: null
  hatch: null
  # Example overrides (replace the null values above):
  # drawing:
  #   affine_scale_min: 0.95
  #   affine_scale_max: 1.05
  #   noise_probability: 0.0
  # hatch:
  #   affine_probability: 0.8
  #   affine_scale_min: 0.5
  #   affine_scale_max: 1.5
  #   rotate_90_probability: 0.75
  #   blur_probability: 0.3
  #   resize_probability: 0.8
  #   resize_scale_min: 0.3
  #   resize_scale_max: 2.0
  #   resize_min_side: 16
  #   resize_interpolation: nearest
  # Use enabled: false inside either mapping to disable that branch.
