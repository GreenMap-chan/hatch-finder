[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatchfinder"
version = "0.1.0"
description = "Conditional heatmap model for finding hatch patterns in drawings"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "PyYAML>=6",
    "pydantic>=2",
    "torch>=2",
    "torchvision>=0.15",
    "tqdm>=4",
]

[project.optional-dependencies]
tools = [
    "numpy>=1.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
