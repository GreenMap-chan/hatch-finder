[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatchfinder"
version = "0.1.0"
description = "Conditional heatmap model for finding hatch patterns in drawings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "GreenMap-chan" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=10",
    "PyYAML>=6",
    "pydantic>=2",
    "torch>=2",
    "torchvision>=0.15",
    "tqdm>=4",
]

[project.optional-dependencies]
tools = [
    "numpy>=1.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
