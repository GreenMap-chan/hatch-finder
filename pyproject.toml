[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatchfinder"
version = "0.1.0"
description = "Conditional heatmap model for finding hatch patterns in drawings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "GreenMap-chan" },
]
keywords = [
    "computer-vision",
    "heatmap",
    "hatching",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "Pillow>=10",
    "PyYAML>=6",
    "pydantic>=2",
    "torch>=2",
    "torchvision>=0.15",
    "tqdm>=4",
]

[project.optional-dependencies]
tools = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/GreenMap-chan/hatch-finder"
Repository = "https://github.com/GreenMap-chan/hatch-finder"
Issues = "https://github.com/GreenMap-chan/hatch-finder/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
